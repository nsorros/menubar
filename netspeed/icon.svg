<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b4a63"/>
      <stop offset="1" stop-color="#1e2633"/>
    </linearGradient>
  </defs>
  <rect x="96" y="96" width="832" height="832" rx="196" fill="url(#tile)"/>
  <rect x="96" y="96" width="832" height="832" rx="196" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="4"/>

  <!-- speedometer -->
  <g transform="translate(512,560)">
    <!-- dial arc -->
    <path d="M -250 0 A 250 250 0 0 1 250 0" fill="none" stroke="#ffffff" stroke-width="46" stroke-linecap="round"/>
    <!-- ticks -->
    <g stroke="#9aa6ba" stroke-width="14" stroke-linecap="round">
      <line x1="-208" y1="-104" x2="-176" y2="-88"/>
      <line x1="-120" y1="-176" x2="-100" y2="-148"/>
      <line x1="0" y1="-210" x2="0" y2="-176"/>
      <line x1="120" y1="-176" x2="100" y2="-148"/>
      <line x1="208" y1="-104" x2="176" y2="-88"/>
    </g>
    <!-- needle pointing to "fast" (upper right) -->
    <g transform="rotate(-42)">
      <path d="M 0 22 L 0 -22 L 224 -7 L 224 7 Z" fill="#30d158"/>
    </g>
    <circle r="40" fill="#ffffff"/>
    <circle r="18" fill="#1e2633"/>
  </g>
</svg>
