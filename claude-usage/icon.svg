    </g>
    <use href="#rays" transform="rotate(45)"/>
    <use href="#rays" transform="rotate(90)"/>
    <use href="#rays" transform="rotate(135)"/>
    <use href="#rays" transform="rotate(180)"/>
    <use href="#rays" transform="rotate(225)"/>
    <use href="#rays" transform="rotate(270)"/>
    <use href="#rays" transform="rotate(315)"/>
    <use href="#rays" transform="rotate(22)"/>
    <use href="#rays" transform="rotate(67)"/>
    <use href="#rays" transform="rotate(112)"/>
    <use href="#rays" transform="rotate(157)"/>
    <use href="#rays" transform="rotate(202)"/>
    <use href="#rays" transform="rotate(247)"/>
    <use href="#rays" transform="rotate(292)"/>
    <use href="#rays" transform="rotate(337)"/>
    <circle r="66" fill="#e0855c"/>
  </g>
</svg>
